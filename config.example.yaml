# Configuration d'exemple de lotor-server. Copier en config.yaml (lu par défaut, ou -c
# chemin). Chaque clé a sa variable d'environnement LOTOR_*, qui l'emporte sur le
# fichier : lotor-server --help les liste toutes. Valeurs de développement, adaptées à
# deploy/compose.yaml.

# Interface web et API publiques.
web:
  host: 127.0.0.1        # LOTOR_HOST
  port: 8080             # LOTOR_PORT
  rate_limit: 100        # LOTOR_RATE_LIMIT : requêtes par minute et par IP (0 : sans limite)
  # Mandataires inverses de confiance (CIDR) : seuls eux peuvent déclarer l'IP du client
  # (X-Forwarded-For) et le HTTPS (X-Forwarded-Proto). LOTOR_TRUSTED_PROXIES, séparés par ,
  trusted_proxies: []

# Délais des serveurs HTTP et arrêt propre.
http:
  read_header_timeout: 10s
  read_timeout: 60s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 30s  # délai laissé aux requêtes en cours sur SIGTERM

# TLS natif, facultatif. Sans lui, placer le serveur derrière un mandataire inverse qui
# termine TLS (le mTLS des agents est alors indisponible).
tls:
  cert_file: ""          # chaîne de certificats PEM
  key_file: ""           # clé privée PEM
  client_ca_file: ""     # autorité des certificats clients des agents : mTLS exigé sur /api/v1/agent/*

# Écoute de gestion, séparée : /healthz, /readyz, /metrics. À ne pas exposer publiquement.
management:
  host: 127.0.0.1
  port: 8081

logging:
  level: info            # debug | info | warn | error
  format: text           # text | json (json en production)
  source: false          # ajoute fichier:ligne

i18n:
  dir: locales           # sans effet : les traductions sont embarquées
  default_language: fr   # langue d'une installation neuve (fr ou en)

# CORS de l'API utilisateur (/api/v1/orgs/…). L'interface et l'API agent ne l'utilisent pas.
cors:
  allowed_origins: ["*"]
  allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  allowed_headers: ["*"]
  exposed_headers: []
  allow_credentials: false
  max_age: 300

# Connexion du rôle d'exécution (ni superutilisateur, ni BYPASSRLS, ni propriétaire des
# tables : le serveur refuse sinon de démarrer).
database:
  driver: postgres       # seul pilote supporté
  dsn: postgres://lotor_app:lotor_app@localhost:5432/lotor?sslmode=disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  startup_timeout: 60s   # attente de la base au démarrage

# Connexion du rôle propriétaire, utilisée seulement pour migrer au démarrage. Vide : le
# serveur ne migre pas et refuse de démarrer si le schéma n'est pas à jour.
migration:
  dsn: postgres://lotor_owner:lotor_owner@localhost:5432/lotor?sslmode=disable
  max_conns: 2           # au moins 2 : le verrou de migration tient une connexion
  lock_timeout: 5m       # attente du verrou d'une autre instance

# Clés de chiffrement des secrets stockés en base (AES-256-GCM). Une clé : 32 octets en
# base64 (openssl rand -base64 32). La clé active chiffre, les autres déchiffrent encore
# (rotation : voir docs/operations.md). Variables : LOTOR_SECRETS_KEYS=id:base64,id2:base64
# et LOTOR_SECRETS_ACTIVE_KEY. Obligatoire : les secrets TOTP sont chiffrés. La clé
# ci-dessous ne sert qu'au développement ; en production, en générer une et la fournir
# hors du fichier.
secrets:
  keys:
    dev: vUzs1bzBzg7NxWGK9RpCQAivA86ZbMXVS2cD1qJ/kJw=
  active_key: dev

# Sessions (authx).
auth:
  session_ttl: 12h       # durée glissante d'une session
  cookie_name: lotor_session
  # on en production : cookies Secure et préfixés __Host- (__Host-lotor_session,
  # __Host-csrf_token, __Host-mfa_challenge), qu'aucun sous-domaine ne peut écraser. Les
  # navigateurs acceptent les cookies Secure sur http://localhost ; auto (Secure en HTTPS,
  # sans préfixe) ou off pour un autre accès en clair (développement seulement).
  cookie_secure: on
  bcrypt_cost: 12        # coût bcrypt des mots de passe (10 à 31)

# Second facteur TOTP (mfax), obligatoire pour tout compte local.
mfa:
  issuer: lotor   # nom affiché dans l'application d'authentification
  challenge_ttl: 10m     # délai pour saisir le code après le mot de passe
  max_attempts: 5        # codes faux tolérés avant de reprendre au mot de passe
  # Verrouillage par compte, tous défis confondus (un nouveau défi s'obtient en rejouant le
  # mot de passe) : au-delà de lockout_threshold codes faux dans lockout_window, le compte
  # est verrouillé lockout_duration, durée doublée à chaque récidive jusqu'à
  # lockout_max_duration. Un code juste, ou la réinitialisation du TOTP, le lève.
  lockout_threshold: 10
  lockout_window: 15m
  lockout_duration: 15m
  lockout_max_duration: 24h
  # Codes de secours : nombre de codes d'un jeu (5 à 50), montrés une seule fois à
  # l'enrôlement et à chaque régénération, chacun valable pour une connexion.
  recovery_codes: 10

# Connexion : tentatives (POST /login et /login/2fa) par minute et par IP (une IPv6 compte
# pour son /64), et durée absolue d'une session depuis la connexion (0 : sans), dans
# laquelle auth.session_ttl glisse.
login:
  rate_limit: 10
  session_max_age: 168h

# API des agents (/api/v1/agent/*) : requêtes par minute et par jeton, et jetons refusés
# par minute et par IP (0 : sans limite). Au-delà, la réponse est 429 avec Retry-After.
agent_api:
  rate_limit: 120
  failure_rate_limit: 30

# API utilisateur (/api/v1/orgs/{org}/*, jetons personnels lotor_pat_) : requêtes par
# minute et par jeton, jetons refusés par minute et par IP (0 : sans limite). Exports de
# la recherche (écran et API) : durée maximale de l'un, nombre simultané par instance
# (au-delà : 429).
user_api:
  rate_limit: 60
  failure_rate_limit: 30
  export_timeout: 5m
  max_exports: 4

# Enrichissement IA des agents dépôt (T12). Chaque dépôt est réglé dans ses paramètres :
# IA désactivée (défaut), modèle local uniquement, ou fournisseur externe (autorisé par un
# administrateur d'organisation, audité). forbid_external: true interdit tout fournisseur
# externe sur l'instance : un projet réglé « fournisseur externe » est alors traité comme
# « modèle local uniquement ».
ai:
  forbid_external: false

# Premier démarrage et secours, lus au démarrage puis à retirer (docs/operations.md).
bootstrap:
  # Premier administrateur d'instance, créé seulement si aucun compte n'existe. Mot de
  # passe temporaire (12 caractères au moins), changé à la première connexion avec
  # l'enrôlement du TOTP. Préférer LOTOR_BOOTSTRAP_ADMIN_PASSWORD au fichier.
  admin_email: ""
  admin_password: ""
  # Procédure de secours : retire au démarrage le TOTP de cet administrateur d'instance et
  # lui impose rescue_password comme mot de passe temporaire (audité), une seule fois par
  # ticket (référence d'incident, 8 caractères au moins). Préférer
  # LOTOR_BOOTSTRAP_RESCUE_PASSWORD au fichier.
  rescue_totp_email: ""
  rescue_ticket: ""
  rescue_password: ""

# File de traitements (ingestion, analyses, échéances) : voir docs/operations.md,
# « Traitements ». Plusieurs instances se partagent la file en base.
workers:
  enabled: true          # false : instance purement web (ni workers ni planificateur)
  concurrency: 4         # jobs simultanés sur cette instance
  poll_interval: 1s      # attente d'un worker sans travail
  lease: 30s             # bail d'un job, renouvelé pendant l'exécution ; reprise après expiration
  retry_base: 10s        # premier délai de réessai, doublé à chaque tentative (gigue de 20 %)
  retry_max: 30m         # délai maximal de réessai, avant gigue
  retention: 168h        # conservation des jobs terminés
  schedule_interval: 10s # fréquence de recherche des échéances dues
  shutdown_timeout: 30s  # délai laissé aux jobs en cours sur SIGTERM, avant leur libération
  org_limit: 2           # jobs lourds (décodage, analyse) simultanés par organisation, toutes instances

# Ingestion des SBOM (docs/operations.md, « Ingestion ») : bornes vérifiées à la réception
# (taille reçue, taille décompressée d'un envoi gzip) puis en flux avant tout décodage
# (taille, profondeur JSON, nombre de composants). Un job de décodage occupe en pointe
# environ trente fois la taille du SBOM décompressé : dimensionner la mémoire des workers
# en conséquence (workers.concurrency jobs simultanés ; ADR 0015).
ingest:
  max_upload_mib: 32         # envoi tel que reçu (gzip ou JSON brut) ; au-delà : 413
  max_decompressed_mib: 64   # JSON décompressé ; au-delà : ingestion en échec
  max_depth: 64              # profondeur d'imbrication du JSON
  max_components: 50000      # composants CycloneDX, paquets SPDX, artefacts Syft
  decode_timeout: 5m         # durée maximale d'un job de décodage
  # Quotas (au-delà : 429, rien n'est stocké ; 0 : sans) : envois stockés par référence
  # sur 24 h (un doublon ne compte pas), volume compressé des SBOM d'une organisation.
  max_per_ref_per_day: 200
  max_org_storage_mib: 10240
  # Téléchargements de SBOM réencodés (CycloneDX, SPDX) simultanés sur cette instance, un
  # par compte (au-delà : 429) : chacun tient plusieurs fois le document en mémoire.
  max_reencodes: 2

# Base de vulnérabilités Grype (docs/operations.md, « Base de vulnérabilités »). Une seule
# instance interroge la liste ; l'archive vérifiée est stockée dans PostgreSQL et chaque
# instance worker en tient une copie locale, synchronisée sur la cible commune.
vulndb:
  listing_url: https://grype.anchore.io/databases/v6/latest.json # liste de distribution, ou son miroir
  dir: /var/lib/lotor/vulndb # copie locale (environ 3,5 Gio, le double pendant une bascule)
  offline: false              # true : jamais de liste, bases importées seulement (site isolé)
  check_interval: 6h          # fréquence d'interrogation de la liste
  sync_interval: 1m           # fréquence à laquelle une instance worker vérifie sa copie
  max_age: 120h               # au-delà, alerte d'administration (5 jours)
  download_timeout: 30m       # durée maximale d'une interrogation, d'un téléchargement ou d'un import téléversé
  max_archive_mib: 2048       # taille maximale d'une archive
  analysis_timeout: 10m       # durée maximale d'un job d'analyse, synchronisation comprise

# Rétention des instantanés (docs/operations.md, « Rétention des instantanés » ; ADR 0039),
# appliquée chaque nuit à 02:30 UTC par une instance worker. Tout instantané de moins de
# `days` jours est gardé ; au-delà, le dernier de chaque mois (UTC), sans limite de durée.
# Ne sont jamais supprimés le dernier instantané d'une référence ni celui en vigueur au
# début de la fenêtre. Les ensembles d'inventaire et SBOM que plus rien ne référence sont
# ensuite supprimés, ainsi que les réceptions terminées plus anciennes que la fenêtre.
retention:
  enabled: true   # false : aucun instantané ni aucune réception supprimé (orphelins supprimés quand même)
  days: 90        # fenêtre où tout est gardé, en jours (1 à 36500)
  count: 0        # derniers instantanés de chaque référence gardés quel que soit leur âge
  monthly: true   # au-delà de la fenêtre, garder le dernier instantané de chaque mois
# Conteneurs des hôtes, projets enfants du projet de leur hôte (docs/operations.md,
# « Conteneurs ») : un conteneur que l'agent n'a plus signalé depuis archive_after voit
# son projet archivé ; il revient s'il redémarre. Archivé pour absence depuis purge_after,
# le projet est supprimé avec son historique par la rétention nocturne (0 : jamais ; au
# moins retention.days) ; un conteneur archivé à la main ou portant une décision de
# triage n'est jamais supprimé.
containers:
  archive_after: 168h         # 7 jours
  purge_after: 4320h          # 180 jours

# Notifications des politiques (T15, docs/notifications.md, ADR 0046). Les canaux sont
# créés par organisation dans l'interface ; leurs secrets sont chiffrés par secrets.keys.
notify:
  public_url: ""                 # URL publique du serveur (https://sbom.example.org) : liens des messages et des verdicts
  timeout: 30s                   # durée maximale d'un envoi (requête HTTP ou session SMTP)
  allow_private_networks: false  # true : les canaux peuvent viser une adresse privée ou locale (relais interne) ; sinon refusé (SSRF)
  digest_hour: 7                 # heure UTC du résumé quotidien des violations (0 à 23)

# Serveur d'envoi des courriels (canaux e-mail). Sans hôte, les canaux e-mail échouent.
smtp:
  host: ""            # serveur SMTP (vide : pas de courriel)
  port: 587           # 587 avec starttls, 465 avec tls
  tls: starttls       # starttls (exigé), tls (TLS implicite) ou none (relais local, sans authentification)
  username: ""        # authentification PLAIN, toujours sous TLS ; vide : sans authentification
  password: ""        # de préférence par LOTOR_SMTP_PASSWORD plutôt que dans ce fichier
  from: ""            # expéditeur des notifications (lotor@example.org)
  helo: localhost     # nom annoncé par EHLO
