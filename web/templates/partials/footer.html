{{define "footer" -}}
<footer class="site-footer">
  <p>{{T "app.name"}} · {{T "footer.version" "Version" .Page.Version}}</p>
  <p>{{T "footer.license"}}</p>
  {{- with .Page.Chrome}}{{if .Authenticated}}
  <p><a class="site-footer__link" href="/sitemap">{{T "footer.sitemap"}}</a></p>
  {{- end}}{{end}}
  <p><a class="site-footer__link" href="https://github.com/leblanc-simon/open-go-sbom">{{T "footer.source"}}</a></p>
</footer>
{{- end}}
