{{define "content" -}}
<div class="auth">
  <section class="auth__card" aria-labelledby="login-title">
    <h1 class="auth__title" id="login-title">{{T "login.heading"}}</h1>
    <p class="auth__lead">{{T "login.lead"}}</p>
    {{- with .ErrorKey}}
    <div class="callout callout--danger" role="alert">
      <div class="callout__body">
        <p class="callout__title">{{T "login.error.title"}}</p>
        <p class="callout__text">{{T .}}</p>
      </div>
    </div>
    {{- end}}
    {{- with .InfoKey}}
    <div class="callout" role="status">
      <div class="callout__body">
        <p class="callout__title">{{T "login.info_title"}}</p>
        <p class="callout__text">{{T .}}</p>
      </div>
    </div>
    {{- end}}
    <form class="form" method="post" action="/login">
      {{csrfField .Page.CSRFToken}}
      {{- with .Next}}<input type="hidden" name="next" value="{{.}}">{{end}}
      <div class="field">
        <label class="field__label" for="login-email">{{T "login.email"}}</label>
        <input class="input" id="login-email" name="email" type="email" autocomplete="username" required value="{{.Email}}"{{if .ErrorKey}} aria-invalid="true"{{end}}>
      </div>
      <div class="field">
        <label class="field__label" for="login-password">{{T "login.password"}}</label>
        <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required{{if .ErrorKey}} aria-invalid="true"{{end}}>
      </div>
      <p><button type="submit" class="btn btn--primary">{{T "login.submit"}}</button></p>
    </form>
    <p class="muted">{{T "login.help"}}</p>
  </section>
</div>
{{- end}}
