{{define "content" -}}
<div class="auth">
  <section class="auth__card auth__card--wide" aria-labelledby="recovery-title">
    <h1 class="auth__title" id="recovery-title">{{T "recovery_codes.heading"}}</h1>
    <p class="auth__lead">{{T "recovery_codes.lead"}}</p>
    {{template "recovery_codes_once" .Codes}}

  </section>
</div>
{{- end}}
