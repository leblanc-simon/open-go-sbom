{{define "content" -}}
<div class="stack">
  <div class="page-head">
    <h1 class="page-head__title">{{T "password.heading"}}</h1>
    <p class="page-head__lead">{{if .Forced}}{{T "password.forced"}}{{else}}{{T "password.lead"}}{{end}}</p>
  </div>
  {{template "flash" .FlashKey}}
  {{template "form_error" .Error}}
  <section class="panel" aria-labelledby="password-form">
    <div class="panel__head"><h2 class="panel__title" id="password-form">{{T "password.form_title"}}</h2></div>
    <div class="panel__body">
      <form class="form" method="post" action="/account/password">
        {{csrfField .Page.CSRFToken}}
        <div class="field">
          <label class="field__label" for="password-current">{{T "password.current"}}</label>
          <input class="input" id="password-current" name="current" type="password" autocomplete="current-password" required{{if eq .Error.Field "current"}} aria-invalid="true"{{end}}>
        </div>
        <div class="field">
          <label class="field__label" for="password-new">{{T "password.new"}}</label>
          <input class="input" id="password-new" name="password" type="password" autocomplete="new-password" minlength="{{.MinLength}}" required aria-describedby="password-new-hint"{{if eq .Error.Field "password"}} aria-invalid="true"{{end}}>
          <p class="field__hint" id="password-new-hint">{{T "password.rule" "Min" .MinLength}}</p>
        </div>
        <div class="field">
          <label class="field__label" for="password-confirm">{{T "password.confirm"}}</label>
          <input class="input" id="password-confirm" name="confirm" type="password" autocomplete="new-password" required{{if eq .Error.Field "confirm"}} aria-invalid="true"{{end}}>
        </div>
        <p><button type="submit" class="btn btn--primary">{{T "password.submit"}}</button></p>
      </form>
    </div>
  </section>
</div>
{{- end}}
