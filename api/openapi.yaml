openapi: 3.1.0
info:
  title: lotor
  version: 0.1.0
  summary: API REST de lotor
  description: |
    Contrat unique de l'API : le serveur et le client des agents en sont générés
    (oapi-codegen, ADR 0006).

    - Routes des agents sous `/api/v1/agent/` (jeton d'agent) ; routes utilisateur sous
      `/api/v1/orgs/{org}/` (jeton personnel, ou session avec l'en-tête `X-CSRF-Token`).
    - Erreurs au format RFC 9457 (`application/problem+json`) : `type` porte une clé stable
      (`error.not_found`), `title` et `detail` sont traduits selon `Accept-Language`.
    - Listes paginées par curseur opaque (`cursor`, `limit`) ; toute liste est bornée.
  license:
    name: WTFPL
    identifier: WTFPL
servers:
  - url: /api/v1
tags:
  - name: agent
    description: API des agents (jeton d'agent ou, pour l'inscription, jeton d'inscription).
  - name: user
    description: API utilisateur d'une organisation (jeton d'accès personnel, lecture seule).
paths:
  /agent/enroll:
    post:
      operationId: enroll
      tags: [agent]
      summary: Inscrit un agent serveur
      description: |
        Échange un jeton d'inscription contre un jeton d'agent. Le serveur crée l'agent et le
        projet de son hôte (étiquettes du jeton), ou le rattache au projet de serveur que
        désigne le jeton, ou au projet qui suit déjà cet hôte s'il n'a pas d'agent actif.
        Le jeton d'agent n'est renvoyé qu'ici : l'agent le conserve dans son répertoire
        d'état. Les étiquettes de l'agent (`labels`) complètent celles du jeton sur un
        projet créé par l'inscription ; en cas de conflit, celles du jeton l'emportent.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "201":
          description: Agent inscrit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /agent/heartbeat:
    post:
      operationId: heartbeat
      tags: [agent]
      summary: Signal de vie d'un agent
      description: |
        Enregistre le dernier contact et la version de l'agent. La réponse indique si un
        scan est demandé depuis l'interface (`scan_requested`) ; la demande est remise une
        seule fois.

        Après un scan dont l'empreinte d'inventaire n'a pas changé, l'agent serveur joint
        `inventory` (empreinte calculée comme le serveur, `sbom.Fingerprint`) au lieu
        d'envoyer son SBOM : si elle est celle de l'ensemble courant de la référence d'hôte,
        seule la date de dernière analyse avance (`inventory: current`) ; sinon l'agent doit
        envoyer son SBOM (`inventory: outdated`). `host` met à jour le contexte de l'hôte.
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: Signal enregistré.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /agent/projects:
    get:
      operationId: listAgentProjects
      tags: [agent]
      summary: Projets confiés à l'agent
      description: |
        Les projets actifs confiés à l'agent et leurs références suivies, par ordre de
        création. Un agent ne voit jamais d'autre projet.
      security:
        - agentToken: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          description: Taille de page (100 par défaut, 200 au plus).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Une page de projets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProjectList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /agent/ingestions:
    post:
      operationId: createIngestion
      tags: [agent]
      summary: Envoie un SBOM
      description: |
        Envoi d'un SBOM pour une référence confiée à l'agent, en deux parties dans cet
        ordre : `context` (JSON, `IngestionContext`) puis `sbom` (le document JSON,
        compressé en gzip de préférence). Formats acceptés : CycloneDX JSON 1.5 à 1.7, SPDX
        JSON 2.3, Syft JSON ; pas de XML.

        La référence est vérifiée avant la lecture du SBOM. Le serveur stocke le document et
        met son décodage en file : la réponse `202` porte l'ingestion en attente, à suivre
        par `getIngestion`. Un document qui ne peut pas être stocké (trop gros une fois
        décompressé, gzip corrompu) donne une ingestion `failed` avec sa clé d'erreur. Un
        envoi identique pour la même référence et le même commit renvoie l'ingestion
        existante (`200`), sans rien créer. Un envoi qui dépasse la taille admise est refusé
        (`413`). Au-delà des quotas de l'instance (envois stockés d'une référence sur 24 h,
        volume des SBOM stockés de l'organisation), l'envoi est refusé sans rien stocker
        (`429`, `error.ingest.quota`, avec `Retry-After`).
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [context, sbom]
              properties:
                context:
                  $ref: "#/components/schemas/IngestionContext"
                sbom:
                  type: string
                  format: binary
                  description: Le SBOM (JSON, ou JSON compressé en gzip).
            encoding:
              context:
                contentType: application/json
              sbom:
                contentType: application/json, application/gzip
      responses:
        "200":
          description: Envoi identique à une ingestion existante, renvoyée telle quelle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingestion"
        "202":
          description: SBOM reçu ; décodage en file (ou ingestion en échec si le document n'a pu être stocké).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingestion"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /agent/ingestions/{id}:
    get:
      operationId: getIngestion
      tags: [agent]
      summary: État d'une ingestion
      description: |
        L'état d'une ingestion envoyée par cet agent : `queued`, `processing`, `done` (avec
        l'instantané produit) ou `failed` (avec une clé d'erreur traduisible).
      security:
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: L'ingestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingestion"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /orgs/{org}/search:
    get:
      operationId: searchOrganization
      tags: [user]
      summary: Recherche transverse dans une organisation
      description: |
        Mêmes requête, filtres, ordre et résultats que l'écran de recherche
        (`/o/{org}/search`) : une page de projets, chacun avec ses occurrences (100 au plus
        par projet, toutes dans l'export). La requête est un nom de composant, un purl
        éventuellement suivi d'une plage `vers` (`pkg:npm/lodash vers:npm/<4.17.21`), un
        identifiant `CVE-…` ou `GHSA-…`, ou une empreinte SHA-256. Une organisation dont le
        propriétaire du jeton n'est pas membre répond 404 ; les résultats se limitent aux
        projets des équipes du propriétaire du jeton (tous pour un administrateur de
        l'organisation).
      security:
        - personalToken: []
      parameters:
        - $ref: "#/components/parameters/Org"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SearchType"
        - $ref: "#/components/parameters/SearchLabel"
        - $ref: "#/components/parameters/SearchOrigin"
        - $ref: "#/components/parameters/SearchKEV"
        - $ref: "#/components/parameters/SearchSeverity"
        - $ref: "#/components/parameters/SearchResolved"
        - $ref: "#/components/parameters/SearchSort"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          description: Projets par page (20 par défaut, 100 au plus).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Une page de résultats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /orgs/{org}/search/export:
    get:
      operationId: exportSearch
      tags: [user]
      summary: Export de toutes les occurrences d'une recherche
      description: |
        Toutes les occurrences, par projet, référence et composant, écrites en flux. CSV :
        une ligne d'en-tête puis une ligne par occurrence (une cellule qui commencerait
        par `=`, `+`, `-` ou `@` est préfixée d'une apostrophe). JSON : un objet
        `{query, kind, truncated, results}`. Les exports simultanés sont bornés par
        instance (429 au-delà).
      security:
        - personalToken: []
      parameters:
        - $ref: "#/components/parameters/Org"
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, json]
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SearchType"
        - $ref: "#/components/parameters/SearchLabel"
        - $ref: "#/components/parameters/SearchOrigin"
        - $ref: "#/components/parameters/SearchKEV"
        - $ref: "#/components/parameters/SearchSeverity"
        - $ref: "#/components/parameters/SearchResolved"
      responses:
        "200":
          description: L'export.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/SearchExport"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /orgs/{org}/projects/{project}/snapshots:
    get:
      operationId: listProjectSnapshots
      tags: [user]
      summary: Frise des instantanés d'un projet
      description: |
        Instantanés du projet, ou d'une seule de ses références, du plus récent au plus
        ancien, chacun avec le décompte de ses changements depuis l'instantané précédent
        de sa référence (absent pour le premier, ou tant que la différence n'est pas
        calculée : `changes_pending`). La rétention réduit l'historique au-delà de sa
        fenêtre (un instantané par mois par défaut). Un projet hors des équipes du
        propriétaire du jeton répond 404.
      security:
        - personalToken: []
      parameters:
        - $ref: "#/components/parameters/Org"
        - $ref: "#/components/parameters/Project"
        - name: ref
          in: query
          description: Identifiant d'une référence suivie du projet.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          description: Instantanés par page (20 par défaut, 100 au plus).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Une page d'instantanés.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /orgs/{org}/projects/{project}/compare:
    get:
      operationId: compareSnapshots
      tags: [user]
      summary: Comparaison de deux instantanés d'un projet
      description: |
        Composants ajoutés, retirés, montés ou descendus de version entre `from` et `to`
        (deux versions d'un même `purl_base` forment une montée ou une descente, comparées
        selon les règles de leur écosystème), et effet sur la sécurité : constats
        introduits et résolus par ce passage (200 au plus de chaque côté, par risque
        décroissant). Sans `from`, la comparaison part de l'instantané précédent de la
        référence de `to` (404 `error.diff.no_previous` pour le premier). Les deux
        instantanés appartiennent au projet ; ils peuvent être de références différentes.
      security:
        - personalToken: []
      parameters:
        - $ref: "#/components/parameters/Org"
        - $ref: "#/components/parameters/Project"
        - name: to
          in: query
          required: true
          description: Instantané d'arrivée.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Instantané de départ (par défaut, le précédent de `to`).
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          description: Ne lister que les changements de cette nature (les décomptes restent complets).
          schema:
            type: string
            enum: [added, removed, upgraded, downgraded]
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          description: Changements par page (100 par défaut, 500 au plus).
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: La comparaison et une page de changements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotComparison"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    enrollmentToken:
      type: http
      scheme: bearer
      description: Jeton d'inscription (`lotor_enr_…`), créé dans l'interface.
    agentToken:
      type: http
      scheme: bearer
      description: Jeton d'agent (`lotor_agt_…`), obtenu à l'inscription.
    personalToken:
      type: http
      scheme: bearer
      description: Jeton d'accès personnel (`lotor_pat_…`).
  parameters:
    Org:
      name: org
      in: path
      required: true
      description: Slug de l'organisation.
      schema:
        type: string
        maxLength: 64
    Project:
      name: project
      in: path
      required: true
      description: Slug du projet.
      schema:
        type: string
        maxLength: 64
    SearchQuery:
      name: q
      in: query
      required: true
      description: Requête de recherche (1 024 octets au plus).
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    SearchType:
      name: type
      in: query
      description: Types de projet retenus (l'un ou l'autre).
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          enum: [repo, host]
    SearchLabel:
      name: label
      in: query
      description: Étiquettes de projet retenues, `clé=valeur` ou `clé` (l'une ou l'autre).
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          maxLength: 200
    SearchOrigin:
      name: origin
      in: query
      description: Origines de la détection retenues.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          enum: [syft, ia]
    SearchKEV:
      name: kev
      in: query
      description: "`1` : seulement les occurrences d'une vulnérabilité activement exploitée."
      schema:
        type: string
        enum: ["1"]
    SearchSeverity:
      name: severity
      in: query
      description: |
        Sévérité maximale des vulnérabilités ouvertes de l'occurrence (pour une recherche
        par vulnérabilité, sa sévérité) ; `none` : sans vulnérabilité ouverte.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          enum: [critical, high, medium, low, negligible, unknown, none]
    SearchResolved:
      name: resolved
      in: query
      description: "`1` : une recherche par vulnérabilité montre aussi les constats résolus."
      schema:
        type: string
        enum: ["1"]
    SearchSort:
      name: sort
      in: query
      description: Ordre des projets (risque maximal décroissant par défaut).
      schema:
        type: string
        enum: [risk, name, snapshot]
    Cursor:
      name: cursor
      in: query
      description: Curseur renvoyé par la page précédente (`next_cursor`).
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      description: Taille de page ; défaut et maximum propres à chaque liste.
      schema:
        type: integer
        minimum: 1
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: Détail d'une erreur (RFC 9457).
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Clé stable de l'erreur, par exemple `error.not_found`.
          examples: [error.not_found]
        title:
          type: string
          description: Résumé traduit, identique pour toutes les occurrences de ce type.
        status:
          type: integer
          description: Code de statut HTTP.
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Explication traduite de cette occurrence.
        instance:
          type: string
          description: Chemin de la requête en erreur.
        request_id:
          type: string
          description: Identifiant de la requête, repris dans les journaux du serveur.
    PageInfo:
      type: object
      description: Pagination d'une liste.
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Curseur de la page suivante ; null sur la dernière page.
    EnrollRequest:
      type: object
      additionalProperties: false
      required: [hostname, version]
      properties:
        hostname:
          type: string
          description: Nom de l'hôte, qui devient sa référence (mis en minuscules).
          minLength: 1
          maxLength: 100
          examples: [srv-db-02]
        version:
          type: string
          description: Version de l'agent.
          maxLength: 64
          examples: [1.4.0]
        labels:
          type: object
          description: Étiquettes de la configuration de l'agent (32 au plus).
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 100
    EnrollmentResult:
      type: object
      required: [agent_id, token, project]
      properties:
        agent_id:
          type: string
          format: uuid
        token:
          type: string
          description: Jeton d'agent (`lotor_agt_…`), renvoyé une seule fois.
        project:
          $ref: "#/components/schemas/ProjectRef"
    ProjectRef:
      type: object
      required: [id, slug]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          description: Version de l'agent.
          maxLength: 64
        inventory:
          $ref: "#/components/schemas/InventoryReport"
        host:
          $ref: "#/components/schemas/HostContext"
    InventoryReport:
      type: object
      description: Scan d'un hôte sans changement d'inventaire depuis le dernier envoi.
      additionalProperties: false
      required: [project_id, ref, fingerprint, scanned_at]
      properties:
        project_id:
          type: string
          format: uuid
        ref:
          type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind:
              type: string
              enum: [host]
            name:
              type: string
              minLength: 1
              maxLength: 255
        fingerprint:
          type: string
          description: Empreinte d'inventaire (SHA-256 en hexadécimal minuscule).
          pattern: "^[0-9a-f]{64}$"
        scanned_at:
          type: string
          format: date-time
          description: Date du scan (au plus une heure d'avance sur l'horloge du serveur).
    HostContext:
      type: object
      description: Contexte de l'hôte au moment du scan.
      additionalProperties: false
      properties:
        hostname:
          type: string
          maxLength: 255
        os_id:
          type: string
          description: ID de /etc/os-release (debian, rhel, alpine…).
          maxLength: 64
        os_version:
          type: string
          description: VERSION_ID de /etc/os-release.
          maxLength: 64
        os_name:
          type: string
          description: PRETTY_NAME de /etc/os-release.
          maxLength: 128
        kernel:
          type: string
          description: Version du noyau (uname -r).
          maxLength: 128
        arch:
          type: string
          description: Architecture (uname -m).
          maxLength: 32
        scan_duration_ms:
          type: integer
          description: Durée du scan, en millisecondes.
          minimum: 0
          maximum: 86400000
    HeartbeatStatus:
      type: object
      required: [scan_requested, server_time]
      properties:
        scan_requested:
          type: boolean
          description: Un scan est demandé depuis l'interface ; remis une seule fois.
        server_time:
          type: string
          format: date-time
          description: Heure du serveur, pour détecter une horloge d'agent décalée.
        inventory:
          type: string
          enum: [current, outdated]
          description: |
            Réponse à `inventory` : `current`, l'inventaire du serveur est à jour et sa
            date de dernière analyse a avancé ; `outdated`, l'agent doit envoyer son SBOM.
    AgentProjectList:
      type: object
      required: [projects, page]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/AgentProject"
        page:
          $ref: "#/components/schemas/PageInfo"
    AgentProject:
      type: object
      required: [id, slug, name, kind, labels, refs]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [repo, host]
        forge_url:
          type: string
          description: URL de la forge (dépôts seulement).
        labels:
          type: object
          additionalProperties:
            type: string
        refs:
          type: array
          items:
            $ref: "#/components/schemas/TrackedRef"
    TrackedRef:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [branch, tag, host]
        name:
          type: string
        last_snapshot:
          $ref: "#/components/schemas/SnapshotRef"
    SnapshotRef:
      type: object
      description: |
        Instantané courant d'une référence (le plus récent par date de scan) ; absent tant
        qu'aucun SBOM n'a été rangé. L'agent dépôt s'en sert pour son rattrapage.
      required: [id, scanned_at]
      properties:
        id:
          type: string
          format: uuid
        commit:
          type: string
          description: Commit de l'instantané (dépôts seulement).
        scanned_at:
          type: string
          format: date-time
    IngestionContext:
      type: object
      additionalProperties: false
      required: [project_id, ref, agent_version, scanned_at]
      properties:
        project_id:
          type: string
          format: uuid
          description: Projet confié à l'agent (`listAgentProjects`).
        ref:
          type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind:
              type: string
              enum: [branch, tag, host]
            name:
              type: string
              minLength: 1
              maxLength: 255
        commit:
          type: string
          description: Commit analysé (SHA-1 ou SHA-256 en hexadécimal) ; exigé pour une branche ou une étiquette, interdit pour un hôte.
          pattern: "^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$"
        agent_version:
          type: string
          maxLength: 64
        scanned_at:
          type: string
          format: date-time
          description: Date du scan (au plus une heure d'avance sur l'horloge du serveur).
        host:
          $ref: "#/components/schemas/HostContext"
    Ingestion:
      type: object
      required: [id, status, project_id, ref_id, received_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, done, failed]
        project_id:
          type: string
          format: uuid
        ref_id:
          type: string
          format: uuid
        commit:
          type: string
        error:
          $ref: "#/components/schemas/IngestionError"
        format:
          type: string
          enum: [cyclonedx, spdx, syft]
        spec_version:
          type: string
        component_count:
          type: integer
          description: Composants de l'inventaire rangé.
        skipped_count:
          type: integer
          description: Composants écartés (sans nom ni purl, ou champ hors bornes).
        snapshot_id:
          type: string
          format: uuid
          description: Instantané produit (statut `done`).
        outcome:
          type: string
          enum: [created, replaced, unchanged]
          description: |
            `created` : nouvel instantané ; `replaced` : nouvel inventaire pour un commit
            déjà reçu ; `unchanged` : inventaire identique, seule la date de dernière
            analyse avance.
        received_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    IngestionError:
      type: object
      required: [key, title, detail]
      properties:
        key:
          type: string
          description: Clé stable, par exemple `error.ingest.too_many_components`.
        title:
          type: string
          description: Résumé traduit selon `Accept-Language`.
        detail:
          type: string
          description: Explication traduite.
        pointer:
          type: string
          description: Pointeur JSON de la violation, pour `error.ingest.schema_invalid`.
    SearchResult:
      type: object
      required: [query, kind, tokens, projects, occurrences, truncated, approximate, out_of_range,
        unreadable_versions, groups, page]
      properties:
        query:
          type: string
          description: Requête normalisée (espaces ramenés à un seul).
        kind:
          type: string
          enum: [name, purl, vulnerability, hash]
        tokens:
          type: array
          description: La requête telle qu'elle a été comprise.
          items:
            $ref: "#/components/schemas/SearchToken"
        projects:
          type: integer
          description: Projets concernés, toutes pages.
        occurrences:
          type: integer
          description: Occurrences, toutes pages.
        truncated:
          type: boolean
          description: La requête désigne plus de composants que la borne (1 000 par nom ou empreinte, 5 000 par paquet).
        approximate:
          type: boolean
          description: Aucun nom ne contient la requête ; les composants sont ceux dont le nom lui ressemble.
        out_of_range:
          type: integer
          description: Occurrences du paquet hors de la version ou de la plage demandées (non renvoyées).
        unreadable_versions:
          type: array
          description: Versions du paquet illisibles dans son écosystème, ni dans la plage ni hors d'elle (non renvoyées).
          items:
            $ref: "#/components/schemas/SearchVersionCount"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SearchGroup"
        page:
          $ref: "#/components/schemas/PageInfo"
    SearchToken:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [name, purl, range, vulnerability, hash]
        value:
          type: string
    SearchVersionCount:
      type: object
      required: [version, occurrences]
      properties:
        version:
          type: string
        occurrences:
          type: integer
    SearchGroup:
      type: object
      required: [project, occurrences, max_risk, truncated, hits]
      properties:
        project:
          $ref: "#/components/schemas/SearchProject"
        occurrences:
          type: integer
        max_risk:
          type: number
          format: double
        last_scanned_at:
          type: string
          format: date-time
        truncated:
          type: boolean
          description: Plus de 100 occurrences dans ce projet ; l'export les donne toutes.
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
    SearchProject:
      type: object
      required: [id, slug, name, kind, labels]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [repo, host]
        labels:
          type: object
          additionalProperties:
            type: string
    SearchHit:
      type: object
      required: [ref, component, weak_identification, open_vulnerabilities, kev, risk, fixed_versions]
      properties:
        ref:
          $ref: "#/components/schemas/SearchRef"
        snapshot_id:
          type: string
          format: uuid
        scanned_at:
          type: string
          format: date-time
        commit:
          type: string
        component:
          $ref: "#/components/schemas/SearchComponent"
        origin:
          type: string
          enum: [syft, ia]
        confidence:
          type: number
          format: double
        weak_identification:
          type: boolean
        open_vulnerabilities:
          type: integer
        max_severity:
          type: string
          enum: [critical, high, medium, low, negligible, unknown]
        kev:
          type: boolean
        risk:
          type: number
          format: double
        fixed_versions:
          type: array
          items:
            type: string
        vulnerability:
          type: string
          description: "Recherche par vulnérabilité : identifiant du constat."
        status:
          type: string
          enum: [open, resolved]
          description: "Recherche par vulnérabilité : état du constat."
    SearchRef:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [branch, tag, host]
        name:
          type: string
    SearchComponent:
      type: object
      required: [id, purl, name, version, type]
      properties:
        id:
          type: string
          format: uuid
        purl:
          type: string
        name:
          type: string
        version:
          type: string
        type:
          type: string
    SearchExport:
      type: object
      required: [query, kind, truncated, results]
      properties:
        query:
          type: string
        kind:
          type: string
        truncated:
          type: boolean
        results:
          type: array
          items:
            type: object
    SnapshotPage:
      type: object
      required: [snapshots, page]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotSummary"
        page:
          $ref: "#/components/schemas/PageInfo"
    SnapshotSummary:
      type: object
      required: [id, ref, scanned_at, last_scanned_at, agent_version, format, spec_version, components, current, changes_pending]
      properties:
        id:
          type: string
          format: uuid
        ref:
          $ref: "#/components/schemas/SearchRef"
        commit:
          type: string
          description: Commit d'un dépôt (absent pour un hôte).
        scanned_at:
          type: string
          format: date-time
        last_scanned_at:
          type: string
          format: date-time
          description: Dernière analyse au même inventaire (hôte).
        agent_version:
          type: string
        format:
          type: string
          description: Format du SBOM reçu (`cyclonedx`, `spdx` ou `syft`).
        spec_version:
          type: string
        components:
          $ref: "#/components/schemas/ComponentCounts"
        current:
          type: boolean
          description: Instantané courant de sa référence.
        previous_id:
          type: string
          format: uuid
          description: Instantané précédent de la même référence (absent pour le premier).
        changes:
          $ref: "#/components/schemas/ChangeCounts"
        changes_pending:
          type: boolean
          description: La différence avec le précédent n'est pas encore calculée.
    ComponentCounts:
      type: object
      required: [total, syft, ia, weak]
      properties:
        total:
          type: integer
        syft:
          type: integer
        ia:
          type: integer
        weak:
          type: integer
    ChangeCounts:
      type: object
      required: [added, removed, upgraded, downgraded]
      properties:
        added:
          type: integer
        removed:
          type: integer
        upgraded:
          type: integer
        downgraded:
          type: integer
    SnapshotComparison:
      type: object
      required: [from, to, counts, changes, page, security]
      properties:
        from:
          $ref: "#/components/schemas/SnapshotSummary"
        to:
          $ref: "#/components/schemas/SnapshotSummary"
        counts:
          $ref: "#/components/schemas/ChangeCounts"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotChange"
        page:
          $ref: "#/components/schemas/PageInfo"
        security:
          $ref: "#/components/schemas/SecurityImpact"
    SnapshotChange:
      type: object
      required: [kind, purl_base, name, type, approximate]
      properties:
        kind:
          type: string
          enum: [added, removed, upgraded, downgraded]
        purl_base:
          type: string
        name:
          type: string
        type:
          type: string
        old:
          $ref: "#/components/schemas/ChangedComponent"
        new:
          $ref: "#/components/schemas/ChangedComponent"
        approximate:
          type: boolean
          description: Versions incomparables dans leur écosystème ; sens déduit de l'ordre des chaînes.
    ChangedComponent:
      type: object
      required: [component_id, purl, version]
      properties:
        component_id:
          type: string
          format: uuid
        purl:
          type: string
        version:
          type: string
    SecurityImpact:
      type: object
      required: [analysis_pending, introduced_total, resolved_total, introduced, resolved]
      properties:
        analysis_pending:
          type: boolean
          description: L'instantané d'arrivée, courant, n'est pas encore analysé ; des constats introduits peuvent manquer.
        introduced_total:
          type: integer
        resolved_total:
          type: integer
        introduced:
          type: array
          items:
            $ref: "#/components/schemas/ImpactFinding"
        resolved:
          type: array
          items:
            $ref: "#/components/schemas/ImpactFinding"
    ImpactFinding:
      type: object
      required: [finding_id, vulnerability, severity, kev, risk, status, ref, component, fixed_versions]
      properties:
        finding_id:
          type: string
          format: uuid
        vulnerability:
          type: string
        severity:
          type: string
          description: "`critical`, `high`, `medium`, `low`, `negligible` ou `unknown`."
        kev:
          type: boolean
        risk:
          type: number
          format: double
        status:
          type: string
          description: État actuel du constat (`open` ou `resolved`).
        ref:
          $ref: "#/components/schemas/SearchRef"
        component:
          $ref: "#/components/schemas/SearchComponent"
        fixed_versions:
          type: array
          items:
            type: string
