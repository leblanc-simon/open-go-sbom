# PostgreSQL de développement et de test : docker compose -f deploy/compose.yaml up -d
#
# - base « lotor » : rôle propriétaire lotor_owner (migrations) et rôle d'exécution
#   lotor_app (sans BYPASSRLS), créés par initdb/01-roles.sql ;
# - tests d'intégration : connexion d'administration « postgres », chaque test crée sa
#   base et ses rôles jetables (données sur tmpfs, perdues à l'arrêt).
name: lotor

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    # go test lance un paquet et un test parallèle par cœur, chacun avec ses pools :
    # environ 160 connexions au pic sur 16 cœurs, au-delà des 100 par défaut.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
