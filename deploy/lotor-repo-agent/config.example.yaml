# Configuration d'exemple de lotor-repo-agent (agent dépôt). Une instance par
# organisation : elle porte le jeton d'un agent dépôt de cette organisation.
# Lue par défaut dans /etc/lotor-repo-agent/config.yaml (ou -c chemin). Chaque clé, sauf
# les forges, a sa variable d'environnement LOTOR_REPO_*, qui l'emporte sur le fichier :
# lotor-repo-agent --help les liste toutes.
#
# Aucun secret dans ce fichier. Un secret se désigne par :
#   credential:<nom>   credential systemd (LoadCredentialEncrypted= de l'unité), lu dans
#                      $CREDENTIALS_DIRECTORY ;
#   /chemin/absolu     fichier lisible du seul compte de l'agent (0600 ou 0400), refusé
#                      sinon.

logging:
  level: info            # LOTOR_REPO_LOG_LEVEL : debug, info, warn, error
  format: json           # LOTOR_REPO_LOG_FORMAT : json en production, text sinon

# Serveur lotor et jeton de l'agent dépôt (créé sur « Agents › Nouvel agent dépôt »).
server:
  url: https://sbom.example.org          # LOTOR_REPO_SERVER_URL
  token_file: credential:agent-token     # LOTOR_REPO_SERVER_TOKEN_FILE
  ca_file: ""            # autorité du certificat du serveur (racines du système si vide)
  timeout: 2m            # durée maximale d'une tentative, envoi du SBOM compris
  retries: 5             # tentatives (erreurs réseau, 429, 5xx ; Retry-After respecté)
  proxy: ""              # http://proxy:3128 ; vide : HTTPS_PROXY et NO_PROXY
  client_cert_file: ""   # certificat client (mTLS, si le serveur l'exige)
  client_key_file: ""    # sa clé : credential:<nom> ou fichier en 0600

# Récepteur de webhooks, exposé aux forges : POST https://<hôte public>/webhooks/<nom de
# la forge>. Placé derrière un mandataire inverse qui termine TLS, ou en TLS natif.
webhook:
  listen: ":8080"        # vide : pas de récepteur, rattrapage seul
  tls_cert_file: ""      # TLS natif : certificat PEM…
  tls_key_file: ""       # … et sa clé (credential:<nom> ou fichier 0600)
  max_body_kib: 1024     # corps au-delà : 413
  rate_limit: 120        # requêtes par minute et par IP (0 : sans limite)
  trusted_proxies: []    # mandataires dont X-Forwarded-For est cru (IP ou CIDR)

# Analyses : un sous-répertoire par analyse, supprimé à la fin quoi qu'il arrive (et au
# démarrage s'il en reste après un arrêt brutal).
work:
  dir: /var/lib/lotor-repo-agent/work
  parallelism: 2         # analyses simultanées (une référence n'est jamais analysée deux fois en même temps)
  queue_size: 1000       # références en attente, en mémoire ; au-delà, reportées au rattrapage
  clone_timeout: 10m
  scan_timeout: 15m
  max_clone_mib: 1024    # taille maximale d'un clone sur disque ; au-delà, échec définitif pour ce commit
  git: git               # binaire git (2.30 au moins)

# Rattrapage : au démarrage puis à intervalle, la tête de chaque référence suivie est
# comparée au dernier commit connu du serveur ; les commits manqués sont analysés du plus
# ancien au plus récent.
catchup:
  interval: 15m
  max_commits: 20        # au plus, les plus récents ; les plus anciens sont sautés

# Forges. Le nom (minuscules, chiffres, tirets) termine l'URL du webhook ; l'URL web est
# comparée à l'« URL de forge » de chaque projet confié. allowed_namespaces (obligatoire)
# borne les dépôts analysés : propriétaires GitHub ou groupes GitLab (sous-groupes
# compris), ou « * » pour tout ce que les identifiants peuvent lire. Les dépôts viennent
# du serveur, donc des administrateurs d'organisation : cette liste est la décision de
# l'exploitant de l'agent.
forges:
  - name: github
    kind: github
    url: https://github.com              # GitHub Enterprise Server : https://hôte
    api_url: https://api.github.com      # GitHub Enterprise Server : https://hôte/api/v3
    app_id: "123456"                     # identifiant (ou client ID) de la GitHub App
    allowed_namespaces: [acme]           # propriétaires dont les dépôts peuvent être analysés
    # installation_id: 0                 # facultatif : sinon cherchée pour chaque dépôt
    private_key_file: credential:github-app-key
    webhook_secret_file: credential:github-webhook-secret
    timeout: 30s

  - name: gitlab
    kind: gitlab
    url: https://gitlab.example.org      # instance (éventuellement sous un sous-chemin)
    token_file: credential:gitlab-token  # jeton du compte de service : read_api, read_repository
    allowed_namespaces: [plateforme]     # groupes (et sous-groupes) autorisés
    webhook_secret_file: credential:gitlab-webhook-secret
    timeout: 30s

# Enrichissement IA (T12, docs/operations.md « Enrichissement IA »). Le serveur transmet le
# réglage de chaque dépôt : IA désactivée (défaut, aucun modèle appelé), modèle local
# uniquement, ou fournisseur externe autorisé par un administrateur d'organisation.
# Sans modèle configuré ici, l'agent envoie le SBOM Syft seul. Le modèle ne lit le dépôt
# que par des outils en lecture seule confinés à l'arborescence de l'analyse ; les
# fichiers sensibles (motifs ci-dessous et clés privées détectées) ne lui sont jamais
# montrés ; aucun composant n'est retenu sans preuve relue dans le fichier.
ai:
  local:
    url: ""                # Ollama, ex. http://127.0.0.1:11434 ; vide : pas de modèle local
    model: ""              # modèle avec appels d'outils (ex. qwen3:14b)
    context_tokens: 32768  # fenêtre de contexte demandée à Ollama
    timeout: 5m            # durée maximale d'une requête
  external:
    provider: ""           # anthropic, ou vide : aucun fournisseur externe
    model: claude-sonnet-5-5
    api_key_file: credential:anthropic-api-key   # clé d'API : credential:<nom> ou fichier 0600
    base_url: https://api.anthropic.com
    timeout: 5m
    retries: 2             # nouvelles tentatives (429, 5xx, erreurs réseau)
  # Budget d'une analyse : au-delà, elle s'arrête et le SBOM part sans composant IA,
  # marqué « enrichissement incomplet ». Toute erreur du fournisseur a le même effet.
  max_turns: 40
  max_input_tokens: 600000
  max_output_tokens: 40000
  max_read_kib: 1024       # contenu du dépôt renvoyé au modèle par les outils
  response_tokens: 8192    # jetons de sortie d'une réponse
  timeout: 20m
  full_interval: 168h      # analyse complète au moins aussi souvent ; sinon fichiers modifiés seulement
  exclude: []              # motifs ajoutés à la liste intégrée (.env, *.pem, *.key, id_rsa*, .ssh, .aws, *.tfstate…)
