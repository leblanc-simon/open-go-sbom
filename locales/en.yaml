error:
  search:
    empty:
      title: Empty query
      text: Enter a component, a purl, a CVE or a SHA-256 digest.
    too_long:
      title: Query too long
      text: The query exceeds 1,024 bytes, or a searched name exceeds 200 characters.
    purl_invalid:
      title: Unreadable purl
      text: "A purl reads pkg:<type>/<namespace>/<name>, optionally followed by @<version>, and is searched alone or with a vers range."
    range_needs_purl:
      title: Range without a purl
      text: "A vers range only applies to a package given by its exact purl, without a version: pkg:npm/lodash vers:npm/<4.17.21. A name search accepts no range."
    range_and_version:
      title: Both a version and a range
      text: Remove the version from the purl (@…) or the vers range, one or the other.
    vers_invalid:
      title: Unreadable vers range
      text: "A range reads vers:<scheme>/<constraints>, constraints separated by « | » (=, !=, <, <=, >, >=), for instance vers:npm/>=4.0.0|<4.17.21."
    vers_scheme:
      title: Unknown vers scheme
      text: "Accepted schemes: npm, maven, pypi, gem, golang, deb, rpm, alpine, semver and semver ecosystems (cargo, nuget, composer…)."
    vers_duplicate:
      title: Repeated version
      text: The same version appears in two constraints of the range.
    vers_version:
      title: Unreadable version in the range
      text: A version of the range does not read according to the rules of its ecosystem.
    vers_mismatch:
      title: Scheme differs from the purl
      text: The range scheme must be the package one (vers:npm for pkg:npm, vers:deb for pkg:deb…).
    vulnerability_invalid:
      title: Unreadable identifier
      text: An identifier reads CVE-YYYY-NNNN or GHSA-xxxx-xxxx-xxxx, alone.
    hash_invalid:
      title: Unreadable digest
      text: A digest reads sha256:<64 hexadecimal characters>, or the 64 characters alone.
    license_unavailable:
      title: License search to come
      text: License search comes with license analysis; meanwhile, search by component.
    filter_invalid:
      title: Unknown filter
      text: A filter or an order in the address does not exist; reset the filters.
  client_cert_required:
    title: Client certificate required
    text: This server requires a valid client certificate (mTLS) for the agent API. Configure the agent's certificate and key.
  back_home: Back to home
  code: "Error {{.Code}}"
  reference: "Request reference: {{.RequestID}}"
  bad_request:
    title: Bad request
    text: The request is unreadable or too large.
  forbidden:
    title: Access denied
    text: Your role in this organization does not allow this action.
  csrf:
    title: Form expired
    text: The form could not be verified. Reload the page, then submit it again.
  not_found:
    title: Page not found
    text: The requested page does not exist or has moved.
  method_not_allowed:
    title: Method not allowed
    text: This address does not accept this kind of request.
  too_many_requests:
    title: Too many requests
    text: You sent too many requests in a short time. Try again in a moment.
  internal:
    title: Internal error
    text: An unexpected error occurred. It has been logged; please try again later.
  invalid_cursor:
    title: Invalid pagination cursor
    text: The cursor is unreadable or stale. Restart the listing from the beginning.
  invalid_limit:
    title: Invalid page size
    text: "The page size must be between 1 and {{.Max}}."
  invalid_request:
    title: Invalid request
    text: The request body or parameters are unreadable or too large.
  validation:
    title: Input refused
    text: A value of the request is not accepted.
  unauthorized:
    title: Authentication required
    text: This address requires a valid token.
  token:
    account_pending:
      title: Credentials to renew
      text: The account owning this token must change its temporary password or enroll a second factor; its tokens are refused until then.
    account_inactive:
      title: Account deactivated
      text: The account that owns this token is deactivated; its tokens are refused.
    invalid:
      title: Token refused
      text: "The token presented is missing, malformed or unknown. Check that it is complete (lotor_agt_…, lotor_enr_… or lotor_pat_…) and suits this operation."
    revoked:
      title: Token revoked
      text: This token has been revoked. Ask an administrator of the organization for a new one.
    expired:
      title: Token expired
      text: This token is past its expiry date. Ask an administrator of the organization for a new one.
  agent:
    disabled:
      title: Agent disabled
      text: This agent has been disabled by an administrator of the organization.
  enrollment:
    exhausted:
      title: Enrollment token used up
      text: This enrollment token has reached its number of uses. Ask an administrator of the organization for a new one.
    host_taken:
      title: Host already tracked
      text: An active agent already tracks this host, or already has this name. Disable the old agent before enrolling the host again.
    project_unavailable:
      title: Project unavailable
      text: The project designated by this token is archived, or already has an active agent.
  ingest:
    too_large:
      title: SBOM too large
      text: The SBOM exceeds the allowed size, compressed or once decompressed. Send it gzip-compressed, or ask the operator to raise the limit.
    too_deep:
      title: SBOM too deep
      text: The document nests too many JSON objects or arrays to be decoded safely.
    too_many_components:
      title: Too many components
      text: The SBOM has more components than this instance allows.
    malformed:
      title: Unreadable SBOM
      text: The document is not valid JSON, or its gzip stream is corrupt.
    unsupported_format:
      title: Unsupported format
      text: "Accepted formats: CycloneDX JSON 1.5 to 1.7, SPDX JSON 2.3 and Syft JSON. XML is not supported."
    schema_invalid:
      title: Non-conforming SBOM
      text: The document does not follow the official schema of its format.
    decode_failed:
      title: Decoding failed
      text: The document conforms to its schema but could not be decoded.
    quota:
      title: Upload quota reached
      text: "This reference received too many uploads within 24 hours, or the organization reached its stored SBOM volume. Try again later; the operator sets these limits (ingest.max_per_ref_per_day, ingest.max_org_storage_mib)."
    ref_unknown:
      title: Unknown reference
      text: This project is not assigned to this agent, is no longer active, or does not track this reference.
    missing_part:
      title: Incomplete upload
      text: "The upload must contain, in this order, a \"context\" part (JSON) then an \"sbom\" part."

