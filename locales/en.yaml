home:
  title: Home
  heading: Welcome to open-go-sbom
  lead: >-
    open-go-sbom inventories the software components of your repositories and servers,
    and analyses them every day to spot known vulnerabilities.
  status_title: Instance status
  status_text: The server is running and its database schema is up to date.
  no_org_title: No organization
  no_org_text: >-
    Your account is not a member of any organization. Ask an administrator of the
    organization to add you.
  create_org: Create an organization

login:
  title: Sign in
  heading: Sign in
  lead: Sign in with your e-mail address and password. A TOTP code will then be requested.
  email: E-mail address
  password: Password
  submit: Continue
  help: Forgot your password or lost your device? Contact an instance administrator.
  error:
    title: Sign-in refused
    invalid_credentials: Incorrect e-mail address or password.
    attempts_exhausted: Too many incorrect codes. Start the sign-in again.

verify:
  title: Verification code
  heading: Verification code
  lead: Enter the six-digit code shown by your authenticator app.
  code: TOTP code
  code_hint: Six digits, renewed every thirty seconds. A code works only once.
  submit: Verify
  lost: Lost your device? An instance administrator can reset your TOTP.
  error:
    title: Code refused
    invalid_code: This code is incorrect, expired or already used.

totp_setup:
  title: TOTP setup
  heading: Set up your second factor
  lead: The second factor is mandatory. Link an authenticator app to your account to continue.
  step_app: Install an authenticator app (FreeOTP, Aegis, KeePassXC…).
  step_scan: Scan the QR code, or type the key below.
  step_code: Enter the six-digit code it shows.
  qr_alt: TOTP setup QR code for your account
  secret: Setup key
  code: Code shown by the app
  submit: Enable
  error:
    invalid_code: "This code is incorrect: a new key was generated, scan the QR code again."

