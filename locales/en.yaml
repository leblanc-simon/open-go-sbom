host_install:
  title: Install the host agent
  meta: Linux amd64 or arm64, deb or rpm package
  package: Install the ogsbom-host-agent package, which creates the ogsbom-agent user and the systemd units.
  package_hint: Pick your distribution's command; replace amd64 or x86_64 with arm64 or aarch64 depending on the architecture.
  server: Set this server's address in the agent configuration.
  server_hint: With a private certificate authority or mTLS, fill in the tls section of the same file too.
  token: Store the enrollment token, readable by the agent user only.
  token_hint: Or encrypt it with systemd-creds (see the operations guide); it never goes into the configuration file.
  start: "Start the agent: it enrolls, inventories the host and sends its first SBOM."
  start_hint: For one scan a day without a daemon, enable ogsbom-host-agent-oneshot.timer instead.
  cleanup: Once the host shows up in the projects, delete the enrollment token; the agent keeps its own token.
