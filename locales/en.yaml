  personal_token_heading: "Revoke the token “{{.Name}}”?"
  personal_token_text: "The token {{.Prefix}}… stops working at once: scripts and integrations using it get an authentication error."
  personal_token_submit: "Revoke the token “{{.Name}}”"
  reset_password_heading: "Reset the password of {{.Email}}?"
  reset_password_text: "The current password stops working, the sessions of the account are closed and its personal access tokens revoked. A temporary password, shown only once, must be passed on to its holder, who changes it at the next sign-in."
  reset_totp_heading: "Reset the TOTP of {{.Email}}?"
  reset_totp_text: "Codes from the current authenticator app are no longer accepted, the password is replaced by a temporary one (shown only once, to pass on to its holder), the sessions of the account are closed and its personal access tokens revoked. Its holder sets up a new TOTP, then changes the password at the next sign-in."
  job_heading: "Discard the job {{.Kind}}?"
  job_text: "The job and its last error are deleted (attempts: {{.Attempts}}); it will not run again. For it to run again, the data that queued it must be produced again."
