home:
  title: Accueil
  heading: Bienvenue sur open-go-sbom
  lead: >-
    open-go-sbom inventorie les composants logiciels de vos dépôts et de vos serveurs, et
    les analyse chaque jour pour y repérer les vulnérabilités connues.
  status_title: État de l'instance
  status_text: Le serveur est démarré et son schéma de base de données est à jour.
  no_org_title: Aucune organisation
  no_org_text: >-
    Votre compte n'est membre d'aucune organisation. Demandez à un administrateur de
    l'organisation de vous y ajouter.
  create_org: Créer une organisation

login:
  title: Connexion
  heading: Connexion
  lead: Connectez-vous avec votre adresse e-mail et votre mot de passe. Un code TOTP vous sera ensuite demandé.
