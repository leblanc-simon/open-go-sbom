    empty:
      title: Requête vide
      text: Saisissez un composant, un purl, une CVE ou une empreinte SHA-256.
    too_long:
      title: Requête trop longue
      text: La requête dépasse 1 024 octets, ou un nom recherché dépasse 200 caractères.
    purl_invalid:
      title: purl illisible
      text: "Un purl s'écrit pkg:<type>/<espace de noms>/<nom>, éventuellement suivi de @<version>, et se cherche seul ou avec une plage vers."
    range_needs_purl:
      title: Plage sans purl
      text: "Une plage vers ne s'applique qu'à un paquet désigné par son purl exact, sans version : pkg:npm/lodash vers:npm/<4.17.21. La recherche par nom n'accepte pas de plage."
    range_and_version:
      title: Version et plage à la fois
      text: "Retirez la version du purl (@…) ou la plage vers : l'une ou l'autre."
    vers_invalid:
      title: Plage vers illisible
      text: "Une plage s'écrit vers:<schéma>/<contraintes>, contraintes séparées par « | » (=, !=, <, <=, >, >=), par exemple vers:npm/>=4.0.0|<4.17.21."
    vers_scheme:
      title: Schéma vers inconnu
      text: "Schémas acceptés : npm, maven, pypi, gem, golang, deb, rpm, alpine, semver et les écosystèmes semver (cargo, nuget, composer…)."
    vers_duplicate:
      title: Version répétée
      text: Une même version figure dans deux contraintes de la plage.
    vers_version:
      title: Version illisible dans la plage
      text: Une version de la plage ne se lit pas selon les règles de son écosystème.
    vers_mismatch:
      title: Schéma différent du purl
      text: Le schéma de la plage doit être celui du paquet (vers:npm pour pkg:npm, vers:deb pour pkg:deb…).
    vulnerability_invalid:
      title: Identifiant illisible
      text: Un identifiant s'écrit CVE-AAAA-NNNN ou GHSA-xxxx-xxxx-xxxx, seul.
    hash_invalid:
      title: Empreinte illisible
      text: Une empreinte s'écrit sha256:<64 caractères hexadécimaux>, ou les 64 caractères seuls.
    license_unavailable:
      title: Recherche par licence à venir
      text: La recherche par licence arrive avec l'analyse des licences ; cherchez en attendant par composant.
    filter_invalid:
      title: Filtre inconnu
      text: Un filtre ou un ordre de l'adresse n'existe pas ; réinitialisez les filtres.
    triage_vulnerability_only:
      title: "Filtre de triage sans objet"
      text: "Le statut de triage porte sur un constat : il ne filtre qu'une recherche par vulnérabilité (CVE-… ou GHSA-…). Retirez ce filtre."
  client_cert_required:
    title: Certificat client exigé
    text: Ce serveur exige un certificat client valide (mTLS) pour l'API des agents. Configurez le certificat et la clé de l'agent.
  back_home: Retour à l'accueil
  code: "Erreur {{.Code}}"
  reference: "Référence de la requête : {{.RequestID}}"
  bad_request:
    title: Requête invalide
    text: La requête est illisible ou trop volumineuse.
  forbidden:
    title: Accès refusé
    text: Votre rôle dans cette organisation ne permet pas cette action.
  csrf:
    title: Formulaire expiré
    text: Le formulaire n'a pas pu être vérifié. Rechargez la page, puis renvoyez-le.
  not_found:
    title: Page introuvable
    text: La page demandée n'existe pas ou a été déplacée.
  method_not_allowed:
    title: Méthode non autorisée
    text: Cette adresse n'accepte pas ce type de requête.
  too_many_requests:
    title: Trop de requêtes
    text: Vous avez envoyé trop de requêtes en peu de temps. Réessayez dans un instant.
  internal:
    title: Erreur interne
    text: Une erreur inattendue s'est produite. Elle a été journalisée ; réessayez plus tard.
  invalid_cursor:
    title: Curseur de pagination invalide
    text: Le curseur fourni est illisible ou périmé. Reprenez la liste depuis le début.
  invalid_limit:
    title: Taille de page invalide
    text: "La taille de page doit être comprise entre 1 et {{.Max}}."
  invalid_request:
    title: Requête invalide
    text: Le corps ou les paramètres de la requête sont illisibles ou trop volumineux.
  validation:
    title: Saisie refusée
    text: Une valeur de la requête n'est pas acceptée.
  unauthorized:
    title: Authentification requise
    text: Cette adresse exige un jeton valide.
  token:
    account_inactive:
      title: Compte désactivé
      text: Le compte propriétaire de ce jeton est désactivé ; ses jetons sont refusés.
    account_pending:
      title: Identifiants à renouveler
      text: Le compte propriétaire de ce jeton doit changer son mot de passe temporaire ou enrôler un second facteur ; ses jetons sont refusés jusque-là.
    invalid:
      title: Jeton refusé
      text: "Le jeton présenté est absent, mal formé ou inconnu. Vérifiez qu'il est complet (lotor_agt_…, lotor_enr_… ou lotor_pat_…) et qu'il convient à cette opération."
    revoked:
      title: Jeton révoqué
      text: Ce jeton a été révoqué. Demandez-en un nouveau à un administrateur de l'organisation.
    expired:
      title: Jeton expiré
      text: Ce jeton a dépassé sa date d'expiration. Demandez-en un nouveau à un administrateur de l'organisation.
  agent:
    containers_limit:
      title: "Trop de conteneurs pour cet hôte"
      text: "Ce signalement créerait plus de projets de conteneurs que la borne de l'instance n'en permet pour un hôte (containers.max_per_host) ; rien n'a été créé. Archivez les conteneurs disparus ou demandez à l'exploitant de relever la borne."
    no_host_project:
      title: Agent sans hôte actif
      text: "Le projet de l'hôte de cet agent est archivé : ses conteneurs ne peuvent être rattachés à rien. Réactivez le projet de l'hôte."
    disabled:
      title: Agent désactivé
      text: Cet agent a été désactivé par un administrateur de l'organisation.
  enrollment:
    exhausted:
      title: Jeton d'inscription épuisé
      text: Ce jeton d'inscription a atteint son nombre d'usages. Demandez-en un nouveau à un administrateur de l'organisation.
    host_taken:
      title: Hôte déjà suivi
      text: Un agent actif suit déjà cet hôte, ou porte déjà ce nom. Désactivez l'ancien agent avant de réinscrire l'hôte.
    project_unavailable:
      title: Projet indisponible
      text: Le projet désigné par ce jeton est archivé, ou a déjà un agent actif.
  ingest:
    too_large:
      title: SBOM trop volumineux
      text: Le SBOM dépasse la taille admise, compressé ou une fois décompressé. Envoyez-le compressé en gzip, ou demandez à l'exploitant de relever la borne.
    too_deep:
      title: SBOM trop profond
      text: Le document imbrique trop d'objets ou de tableaux JSON pour être décodé sans risque.
    too_many_components:
      title: Trop de composants
      text: Le SBOM compte plus de composants que la borne de l'instance n'en admet.
    malformed:
      title: SBOM illisible
      text: Le document n'est pas un JSON valide, ou son flux gzip est corrompu.
    unsupported_format:
      title: Format non pris en charge
      text: "Formats acceptés : CycloneDX JSON 1.5 à 1.7, SPDX JSON 2.3 et Syft JSON. Le XML n'est pas pris en charge."
    schema_invalid:
      title: SBOM non conforme
      text: Le document ne respecte pas le schéma officiel de son format.
    decode_failed:
      title: Décodage impossible
      text: Le document est conforme à son schéma mais n'a pas pu être décodé.
    quota:
      title: Quota d'envois atteint
      text: "Cette référence a reçu trop d'envois en 24 heures, ou l'organisation a atteint son volume de SBOM stockés. Réessayez plus tard ; l'exploitant règle ces bornes (ingest.max_per_ref_per_day, ingest.max_org_storage_mib)."
    ref_unknown:
      title: Référence inconnue
      text: Ce projet n'est pas confié à cet agent, n'est plus actif, ou ne suit pas cette référence.
    missing_part:
      title: Envoi incomplet
      text: "L'envoi doit comporter, dans cet ordre, une partie « context » (JSON) puis une partie « sbom »."

