  password: Mot de passe
  submit: Continuer
  help: Mot de passe oublié ou appareil perdu ? Adressez-vous à un administrateur de l'instance.
  error:
    title: Connexion refusée
    invalid_credentials: Adresse e-mail ou mot de passe incorrect.
    attempts_exhausted: Trop de codes incorrects. Reprenez la connexion depuis le début.

verify:
