  heading: Code de vérification
  lead: Saisissez le code à six chiffres affiché par votre application d'authentification.
  code: Code TOTP
  code_hint: Six chiffres, renouvelés toutes les trente secondes. Un code ne sert qu'une fois.
  submit: Vérifier
